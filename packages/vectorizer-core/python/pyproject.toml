[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vectorizer-core"
version = "0.1.0"
description = "Monochrome icon-sheet segmentation and high-fidelity SVG vectorization for VectorGlyphs/vectorizer.app."
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "pillow>=10.0",
  "scikit-image>=0.25",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
vectorizer-core = "vectorizer_core.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
