[project]
name = "vectorglyphs-glyph-core"
version = "0.1.0"
description = "Standalone deterministic procedural glyph generation core for VectorGlyphs."
requires-python = ">=3.11"
dependencies = ["Pillow>=10"]

[project.optional-dependencies]
dev = ["pytest>=9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
